version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexatrade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexatrade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-nexatrade_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexatrade} -d ${POSTGRES_DB:-nexatrade_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: nexatrade-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-nexatrade}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-nexatrade_db}?schema=public"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - app_logs:/app/logs

volumes:
  postgres_data:
  app_logs:
