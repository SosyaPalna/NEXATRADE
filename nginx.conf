# ============================================================
# NexaTrade — Hardened Nginx Reverse Proxy Configuration
# ============================================================
# Place this file in /etc/nginx/sites-available/nexatrade
# Then: ln -s /etc/nginx/sites-available/nexatrade /etc/nginx/sites-enabled/
# Test: nginx -t && systemctl reload nginx

upstream nexatrade_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Hide Nginx version from responses
server_tokens off;

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name nexatrade.ru www.nexatrade.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nexatrade.ru www.nexatrade.ru;

    # SSL Certificates (replace with your actual paths after certbot)
    ssl_certificate /etc/letsencrypt/live/nexatrade.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexatrade.ru/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Client max body size (for image uploads)
    client_max_body_size 50M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # ── BLOCK ACCESS TO SENSITIVE FILES ──
    # Deny hidden files (.env, .git, .htaccess, etc.)
    location ~ /\. {
        deny all;
        return 404;
    }

    # Deny backup files, logs, dumps, configs
    location ~* \.(bak|sql|dump|log|tar\.gz|tgz|zip|rar|7z|env|config|yml|yaml|xml|lock|dist)$ {
        deny all;
        return 404;
    }

    # Deny access to common sensitive directories
    location ~* ^/(backup|backups|temp|tmp|cache|logs|log|config|db|database|.svn|.hg|.idea|.vscode)(/|$) {
        deny all;
        return 404;
    }

    # Deny known debug/config files at root
    location = /phpinfo.php { deny all; return 404; }
    location = /info.php     { deny all; return 404; }
    location = /console      { deny all; return 404; }
    location = /web.config   { deny all; return 404; }
    location = /database.yml { deny all; return 404; }
    location = /config.json  { deny all; return 404; }
    location = /config.php   { deny all; return 404; }
    location = /config.yml   { deny all; return 404; }
    location = /error.log    { deny all; return 404; }
    location = /access.log   { deny all; return 404; }
    location = /debug.log    { deny all; return 404; }
    location = /.project     { deny all; return 404; }
    location = /pom.xml      { deny all; return 404; }
    location = /composer.lock { deny all; return 404; }
    location = /package-lock.json { deny all; return 404; }
    location = /yarn.lock    { deny all; return 404; }
    location = /.DS_Store    { deny all; return 404; }
    location = /Thumbs.db    { deny all; return 404; }
    location = /www.tar.gz   { deny all; return 404; }
    location = /site.tar.gz  { deny all; return 404; }
    location = /backup.tar.gz { deny all; return 404; }
    location = /backup.zip   { deny all; return 404; }
    location = /backup.sql   { deny all; return 404; }
    location = /database.sql { deny all; return 404; }
    location = /dump.sql     { deny all; return 404; }
    location = /db.sql       { deny all; return 404; }
    location = /wp-config.php.bak { deny all; return 404; }

    # Uploaded files (images, docs)
    location /uploads/ {
        alias /var/www/NEXATRADE/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri $uri/ =404;
    }

    # Static files (nginx serves them directly, bypassing Node.js)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://nexatrade_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Socket.io WebSocket support
    location /socket.io/ {
        proxy_pass http://nexatrade_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # API and SPA fallback
    location / {
        proxy_pass http://nexatrade_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
